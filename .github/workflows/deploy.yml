name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Atualiza semanalmente a cópia da planta do LCC embutida no app (fallback do gateway).
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar snapshot do site do LCC
        run: npm run lcc:snapshot
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Variável do repositório (Settings → Secrets and variables → Actions → Variables)
          VITE_WCC_GATEWAY_URL: ${{ vars.WCC_GATEWAY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
